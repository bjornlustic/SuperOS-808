; SuperOS-808 — open TR-808 firmware for the AT90USB1286 CPU replacement
; (any AT90USB1286 board that drops into the µPD650C socket; Teensy++ 2.0 class)
;
; Build: PlatformIO.  `pio run`  -> builds the app + bootloader, packs a
; flashable .syx. The post-build scripts call `git rev-parse`, so this must be a
; git repo.
;
; Normal order for a fresh board:
;   pio run -e bootloader          then flash it once over ISP
;   pio run -e fuses               (blank chip only)
;   pio run -e combined        -> SuperOS-808_*.syx, flash over MIDI SysEx
[platformio]
src_dir = src
default_envs = app-flash, bootloader

[env]
custom_project_version = 0.3

; ---- main firmware, generic ------------------------------------------------
; Base env. Everything real extends one of the board-specific envs below; this
; one exists so they share the flags.
[env:app]
framework = arduino
platform = teensy
board = teensy2pp
board_build.f_cpu = 16000000L
; SUPEROS_PI0_PIN=36 (PE4): SuperOS-303CPU v1.3 wires J4 edge pin 30 (PI0,
; RAM /WE / MODE probe) to PE4, not the pins.h default PA5/Teensy 33.
build_flags =
  -Wl,--section-start=.text=0x0000
  ; Linker relaxation was tried here (-mrelax -Wl,--relax, clean build) and
  ; measured ZERO bytes on this image: cross-unit calls on a 128 KB part sit
  ; outside rcall/rjmp range and -Os already shortens the near ones. Recorded
  ; so the next flash hunt does not re-try it.
  ;
  ; -mcall-prologues DID pay, and paid big: register-heavy prologues/epilogues
  ; become calls into shared avr-libc stubs (__prologue_saves__ /
  ; __epilogue_restores__). Measured on combined-nat 2026-08-28 against the
  ; uClock+sysex_enable change: 1574 bytes of app flash (-665 free -> +909),
  ; identical RAM. Stack cost is zero (the stubs push the same registers; entry
  ; is a jump, exit ijmps through Z). Cycle cost is tens of cycles per call of
  ; a register-heavy function, against the emulator gate's measured 36x pace
  ; headroom (ran_peak 55 of the 2000 clamp, docs/gates/G5). If a timing gate
  ; ever regresses, this flag is the first suspect to A/B.
  -mcall-prologues
  -DSUPEROS_PI0_PIN=36
  ; USB MIDI: enumerate as a USB-MIDI device so notes/clock/SysEx run over
  ; USB-C as well as DIN. On the AT90USB (Teensy 2.0) core, USB type is
  ; selected by the USB_MIDI macro (the combined *_SERIAL types are Teensy
  ; 3.x+ only); defining a built-in USB flag suppresses the default
  ; USB_SERIAL (platforms/teensy arduino.py). SUPEROS_USB_MIDI gates the
  ; firmware-side wiring and keeps setup() from tearing USB down.
  -DUSB_MIDI
  -DSUPEROS_USB_MIDI
  ; USB product-string descriptor — overrides the core's #ifndef-guarded
  ; default ("Teensy MIDI") so the device enumerates as "SuperOS-808".
  -DSTR_PRODUCT='L"SuperOS-808"'
  ; Serial-number descriptor (core patched by tools/patch_usb_core.py to
  ; serve it). Hosts match serial-less devices by USB port: macOS CoreMIDI
  ; re-uses whatever device entity last lived on that port, so a serial-less
  ; unit can inherit another device's name. A stable serial ends that.
  -DSTR_SERIAL_NUMBER='L"SOS808-0001"'
build_src_filter = +<*> -<bootloader/*> -<flash_service/*> -<d650/*>
extra_scripts =
  pre:tools/version_flag.py
  pre:tools/patch_usb_core.py
  post:tools/makesyx.py

; ---- SuperOS only, no emulator --------------------------------------------
; Patterns live in the wear-leveled internal flash arena and need the SPM flash
; service installed once (env:flash-service).
[env:app-flash]
extends = env:app

; ---- combined SuperOS-808 + µPD650C-085 emulator ---------------------------
; The emulator's µPD444C pattern image lives in the AT90USB1286's internal
; EEPROM (2048 B at 0x020) and the program image MUST be compiled in — the
; pattern image plus an uploadable program image is 4 KB against a 4096-byte
; EEPROM, so there is no room to store an upload.
; Generate the (gitignored) header from your own µPD650C-085 first:
;   python3 tools/d650/make_image_embed.py <dump.syx>
; SuperOS-side patterns use the internal flash arena, so install the SPM flash
; service too (env:flash-service).
;
; NOTE on some CPU boards: a PWM-CV filter (R13 3.3k / C3 220nF / R14 100k, fc =
; 219 Hz) is hard-wired to socket pin 18, which on the TR-808 is PF2 = BASS DRUM.
; With no bypass mux, BD will not latch cleanly against COMMON TRIG. That is a
; board limitation, not a firmware one; every other voice is unaffected.
[env:combined]
extends = env:app
build_flags =
  ${env:app.build_flags}
  -DSUPEROS_COMBINED
  -DD650_IMG_IN_RAM
  -DD650_IMG_EMBEDDED
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
build_src_filter = +<*> -<bootloader/*> -<flash_service/*>

; ---- MIDI SysEx bootloader (lives at 0x1F000) ------------------------------
; f_cpu is the real crystal (16 MHz): the _delay_ms calls and the DIN baud
; divisor are both derived from it, and main() forces CLKPR back to /1 on entry
; so the bootloader always runs at that rate no matter what divider the app or
; the CKDIV8 fuse left behind.
[env:bootloader]
build_src_filter = +<bootloader/*>
platform = atmelavr
platform_packages = tool-sreccat
board_build.mcu = at90usb1286
board_build.f_cpu = 16000000L
framework =
build_flags =
    -Os
    ; Page 0x1F0 is the PERMANENT page and holds only the reset stub and the
    ; commit-recovery routine; reset enters the boot section at its first byte,
    ; so the stub is pinned at 0x1F000 (the app-requested jump from SysEx 0x4A
    ; lands there too) and the recovery routine sits behind it in the same page.
    ; The body starts on the next page boundary because an over-the-wire update
    ; replaces WHOLE PAGES 0x1F1..0x1F8 and must not be able to reach the stub
    ; that would rescue it. 2 KB for the body; the link fails if it overruns.
    ; .body_entry is the body's fixed doorway at its first byte: the permanent
    ; stub jumps to that constant rather than to main, so main is free to move
    ; without re-encoding a page the updater does not carry.
    ; The flash service owns 0x1FA00+; check the map after build.
    -Wl,--section-start=.boot_entry=0x1F000
    -Wl,--section-start=.boot_recover=0x1F020
    -Wl,--section-start=.body_entry=0x1F100
    -Wl,--section-start=.text=0x1F110
    ; body_entry is reached only by a literal address in the stub's asm, so
    ; nothing references the symbol and --gc-sections would drop it. Root it.
    -Wl,--undefined=body_entry
    -Wl,--entry=boot_entry
    -nostartfiles
    -nostdlib
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
; Atmel-ICE over ISP. -B 4 sets a 250 kHz ISP clock, which is safe even with
; CKDIV8 still programmed (a fresh board runs at 2 MHz and ISP must stay under
; f/4). Swap atmelice_isp for usbasp if using the cheap programmer instead.
upload_protocol = custom
upload_command =
    avrdude -c atmelice_isp -p at90usb1286 -B 4
    -U flash:w:$SOURCE:i
; Also emits bootloader-update.syx: the same image in the form the RUNNING APP
; accepts (SysEx 0x70/0x71), which is how the bootloader is replaced over USB-C
; or DIN without a programmer. Send it with tools/send_boot_update.py.
extra_scripts =
    post:tools/make_boot_syx.py

; ---- 4 MHz core variant ----------------------------------------------------
; Same firmware with the CPU clock divided to 4 MHz (CLKPR /4 from the 16 MHz
; crystal; see the SUPEROS_CPU_DIV4 block in main.cpp). USB is unaffected --
; clkUSB comes off the PLL, which still sees the full 16 MHz -- and the MIDI
; baud divisor now derives from F_CPU, so DIN tracks the change too.
;
; Costs, before reaching for this: the ~1 ms panel-scan + LED-multiplex pass
; becomes ~4 ms, so the LED refresh is four times slower (visible flicker) and
; the sequencer's timing resolution is correspondingly coarser. Do NOT use it
; for -e combined: the emulator core will not hold real time at 4 MHz.
;
; Only the APP is built here. The bootloader stays a 16 MHz build: it forces
; CLKPR back to /1 at entry (see bootload.c), so it runs at the crystal rate
; whether it was reached by reset or by a SysEx 0x4A jump out of this app, and
; its UBRR and delays are right in both cases.
[env:app-4mhz]
extends = env:app-flash
board_build.f_cpu = 4000000L
build_flags =
  ${env:app.build_flags}
  -DSUPEROS_CPU_DIV4

; ---- combined at 4 MHz (experimental) --------------------------------------
; The emulator on the divided core. The warning on env:app-4mhz applies with
; force here: the emulator core is written against real time and at 4 MHz the
; ~1 ms scan+display pass becomes ~4 ms, so expect its sequencer to drift or run
; slow. Nothing is damaged by trying it; this env exists so the timing can be
; judged by ear rather than argued about. Use env:combined for anything real.
;
; SEPARATE, PRE-EXISTING FAULT, not caused by the divided clock: on COMBINED
; builds the app's outgoing MIDI barely works. Measured on hardware 2026-08-24
; over six seconds, sequencer running: DIN carried 254 clocks and USB carried
; none at all, and queued messages (SysEx replies, playhead broadcasts) answered
; roughly one request in three even on DIN. Incoming USB is fine, so SysEx 0x4A
; and firmware updates still work. It reproduces identically at 16 MHz on
; env:combined and on the checked-in d35f978 build from before the USB-C work,
; so it is neither new nor clock-related. First place to look is RAM: combined
; sits at 91.0%, leaving roughly 700 bytes of stack under a USB core that the
; SuperOS-only builds give far more room.
[env:combined-4mhz]
extends = env:combined
board_build.f_cpu = 4000000L
build_flags =
  ${env:combined.build_flags}
  -DSUPEROS_CPU_DIV4

; ---- emulated-throughput probe (bench) -------------------------------------
; combined-4mhz plus the D650_CYCLE_PROBE counter in emu_avr.cpp, which publishes
; emulated machine cycles/s and emulator loop passes/s to EEPROM 0x010 once a
; second. Read it over ISP while the machine runs:
;   avrdude -c atmelice_isp -p at90usb1286 -B 125kHz -U eeprom:r:ee.bin:r
; The number to compare against is 113636 cyc/s, the real chip's rate, which
; ucom4.c is tuned to just meet at 16 MHz. EEPROM-backed rather than SysEx
; because the combined build's outgoing MIDI is unreliable. Never ship this: it
; writes EEPROM every second.
[env:combined-4mhz-probe]
extends = env:combined-4mhz
build_flags =
  ${env:combined-4mhz.build_flags}
  -DD650_CYCLE_PROBE

; Native ISR (src/d650/emu/ucom4_hle.h) plus the cycle probe, so the speedup can
; be read off the device rather than assumed.
[env:combined-4mhz-hle]
extends = env:combined-4mhz
build_flags =
  ${env:combined-4mhz.build_flags}
  -DUCOM4_HLE
  -DD650_CYCLE_PROBE

; Statically translated hot regions (tools/d650/gen_native.py; verified in
; lockstep against the interpreter by tools/d650/difftest.sh) plus the cycle
; probe. Supersedes the hand-written ISR HLE. Regenerate ucom4_native.h after
; changing the image: python3 tools/d650/gen_native.py
[env:combined-4mhz-nat]
; SHIPPING emulator build: statically translated D650C core, 4 MHz, no probes.
; The telemetry envs below are the same image plus EEPROM instrumentation, which
; is not free -- the probe record alone is ~8 changed EEPROM bytes at 3.3 ms
; each, so it must never be in a build that goes on a machine.
extends = env:combined-4mhz
build_flags =
  ${env:combined-4mhz.build_flags}
  -DUCOM4_NATIVE
  -DUCOM4_SINGLETON
  -Wl,--section-start=.d650img=0xE000
  -Wl,--section-start=.natcode=0xE800

[env:combined-nat]
; SHIPPING emulator build for the 808: statically translated D650C core at 16 MHz,
; NO clock divide, no probes. Decided 2026-08-25 (rule 7): the 808 has no EMI
; reason for the 4 MHz divide -- its PA0-2 status nets carry 15K DC pull-downs
; (R76-R82), not the 606's diode-isolated float (claim-028/claim-030), and the
; panel measured EMI-clean at 16 MHz (claim-008 item 3).
;
; THE THROUGHPUT FIGURES THAT USED TO BE ON THIS LINE ARE RETRACTED (2026-08-26).
; It read "Native at 16 MHz holds real time (~208% of 113636 cyc/s) where 4 MHz
; sat at ~52%". Neither number was ever measured: 208% was a capacity estimate,
; and cycle_probe(ran) counts cycles the emulator was ASKED to run against the
; 7447/65536 = 113632 cyc/s pace target, so it reads AT the target whether the
; build has 2x headroom or 1%. The 52% was 236k/4, and the 236k row was itself
; already retracted in finding 24 as a projection (1af8b49).
;
; MEASURED instead, two boots each (1af8b49, 102df27): 4 MHz 113276/113190,
; 16 MHz 113245/113462, all 99.6-99.8% of pace with 0 hitches. BOTH CLOCKS
; DELIVER THE SAME EMULATED-CYCLE RATE. 16 MHz buys HEADROOM, not speed:
; ran_peak 55 against 127 of the 2000 clamp. So 4 MHz does not fail the emulator
; gate, and the reason this env ships at 16 MHz is the margin plus the panel and
; LED cost of the divide (see the 4 MHz section above), not a pace failure.
;
; TWO MORE FIGURES THAT WERE ON THE OLD LINE, scored rather than deleted:
;   "the plain interpreter at 16 MHz only reached 81.7%" -- finding 24's ~92k
;     cyc/s row. NOT re-checked by me and NOT scored here either way. It is the
;     INTERPRETER, not this env's native core, so it does not bear on the
;     shipping decision; G5_808_BENCH_WINDOW.md cites the same ~92k as the
;     signature of nat_state 0xEE (native core NOT running).
;   "8 MHz (~104%) was rejected: no margin" -- 104 is 208/2, so it is a division
;     of the retracted capacity estimate and falls WITH it. There is no 8 MHz env
;     in this file and no 8 MHz run on record. If 8 MHz is ever wanted, it has to
;     be built and measured; do not cite ~104% as a reason it was ruled out.
; Same native image as combined-4mhz-nat, minus SUPEROS_CPU_DIV4, at the board's
; native 16 MHz.
extends = env:combined
build_flags =
  ${env:combined.build_flags}
  -DUCOM4_NATIVE
  -DUCOM4_SINGLETON
  -Wl,--section-start=.d650img=0xE000
  -Wl,--section-start=.natcode=0xE800

[env:combined-nat-lamp]
; claim-130: combined-nat plus the VARIATION-lamp probe, and NOTHING else. It is
; its own env rather than a flag on combined-nat-test because that build has 79
; bytes of headroom and this needs a few hundred -- and because the measurement
; wants the SHIPPING code path, not one carrying the panel-inject hooks.
;
; Measures PE1 in BOTH firmwares into .noinit, which survives the watchdog reset
; that switches between them, so one host script can A/B them on one machine.
extends = env:combined-nat
build_flags =
  ${env:combined-nat.build_flags}
  -DSUPEROS_LAMP_PROBE
  ; claim-131 key queue stripped: this instrument sat within a few hundred
  ; bytes of the ceiling and its question does not involve step entry. It
  ; therefore measures a machine WITHOUT the write-mode key queue.
  -DSUPEROS_NO_KEYQUEUE

[env:combined-nat-test]
; combined-nat (the shipping image) + the G12 test hooks: SysEx 0x4B panel inject
; and the 0x44/0x45 engine runtime dump. NEVER ship it -- 0x4B lets a host forge
; panel state, so a machine someone plays must not carry it. This is the build
; the G12 regression suite runs against; see docs/gates/G12_808_DRIVE_OBSERVE.md
; for what each hook exists to close.
extends = env:combined-nat
build_flags =
  ${env:combined-nat.build_flags}
  -DSUPEROS_TESTHOOKS
  ; see app-test: hook bodies sit at 0x17C60, in the natcode window
  -Wl,--section-start=.testhook=0x17C50

[env:combined-nat-hwm]
; combined-nat (the shipping image) + the claim-080 stack high-water instrument:
; paint the free RAM in .init1, read the mark back over SysEx 0x46 -> 0x47.
; See src/stack_hwm.h for why a painted mark and not more static analysis.
;
; IT EXTENDS combined-nat AND NOT combined-nat-test, DELIBERATELY, for two
; independent reasons. Flash: combined-nat-test had TWELVE BYTES of headroom
; below the 0xD700 commit-arm page when this was written and has 159 B now, and
; the instrument costs 312 B, so it does not fit either way without dropping
; something (env:combined-nat-test-hwm below does, and says what it costs).
; Instrument: the number Phase 0 wants is the SHIPPING build's
; peak, and combined-nat-test is a different binary with 12 B more static RAM
; and extra reachable code, so a mark measured there answers a question nobody
; asked. This env differs from the shipping image only by the instrument, which
; is the smallest perturbation available.
;
; The cost of that choice, stated rather than discovered later: 0x4B panel
; injection is NOT in this build, so the panel-reachable chains cannot be driven
; from the host here. Everything on the SysEx side (0x13 edits, 0x1D slot
; select, bulk dumps) can be, and that is where the measured peak currently is.
extends = env:combined-nat
build_flags =
  ${env:combined-nat.build_flags}
  -DSUPEROS_STACK_HWM
  ; claim-131 key queue stripped: this instrument sat within a few hundred
  ; bytes of the ceiling and its question does not involve step entry. It
  ; measures a machine WITHOUT the write-mode key queue.
  -DSUPEROS_NO_KEYQUEUE

[env:combined-nat-test-hwm]
; The stack instrument AND the panel injector in one image, which is the only
; way to put a PANEL-reachable chain into a measured mark. combined-nat-hwm's
; own comment above names this as the cost of its choice: 0x4B is not in it, so
; the 494 B hardware peak contains nothing the panel can reach, and the panel is
; where the deepest chains were always suspected to be.
;
; It does not fit without paying for it. combined-nat-test has 159 B of real
; headroom and the instrument costs 312 B, so this is 153 B over on its own.
; SUPEROS_NO_SYSEX_RANDOMIZE buys 460 B back and is the right thing to drop
; here: 0x2E is HOST-driven, so it is not a panel chain, and the panel's own
; randomize is a SEPARATE path, so the chain this env exists to measure is still
; in the image. Checked, not assumed: SUPEROS_NO_SYSEX_RANDOMIZE guards exactly
; one block, midi.cpp:435-464, and the panel calls Engine::RandomizeInst direct
; from main.cpp:719 and main.cpp:861. The symbol is in the ELF at 0x6034 -- as a
; WEAK (W) symbol, which an nm filter on t/T does not show.
;
; NEVER SHIP: 0x4B forges panel state and the paint costs 2 B of static RAM.
; The number it produces is NOT the shipping build's peak: this binary is not
; combined-nat. Measured at 4d794ac: static RAM 7168 against the shipping
; build's 7154, budget 981 against 995, and mainline peaks 519/514/511 against
; 521/516/511, the two that fall being chains the dropped 0x2E handler was in.
; What it can do that combined-nat-hwm cannot is drive a PANEL chain into the
; mark, and a panel chain that overruns here is a panel chain that overruns on
; the shipping build too, which is the question worth asking.
extends = env:combined-nat-test
build_flags =
  ${env:combined-nat-test.build_flags}
  -DSUPEROS_STACK_HWM
  -DSUPEROS_NO_SYSEX_RANDOMIZE

[env:app-test]
; The same hooks on the SuperOS-only app build. Useful because the app has ~6x
; the stack headroom of a combined build (finding 12), so a suite failure here
; vs there separates a feature bug from a RAM-pressure bug.
extends = env:app
build_flags =
  ${env:app.build_flags}
  -DSUPEROS_TESTHOOKS
  ; .testhook lives in the natcode window, above the app ceiling and below
  ; the arena (midi_api.h TESTHOOK_CODE). Any .natcode growth past 0x17C60
  ; becomes a link error instead of a makesyx warning.
  -Wl,--section-start=.testhook=0x17C50

[env:app-test-pcint]
; app-test plus the pin-change ISR attribution counters (claim-104), 0x45 bytes
; 20..31. Its OWN env and not part of app-test, because it costs ~694 B and
; app-test's flags are inherited by combined-nat-test, which is already over the
; 0xD700 ceiling. A diagnostic whose question is answered must not tax every
; other testhooks build; that is why -probe, -hwm and -duty are separate too.
build_flags =
  ${env:app-test.build_flags}
  -DSUPEROS_PCINT_ATTRIB
extends = env:app-test

[env:app-test-pcintctl]
; app-test plus the POSITIVE CONTROL for the pin-change ISR, and it exists
; because a zero from that instrument is otherwise uninterpretable.
;
; The attribution counters read pc_entry 0 on hardware: the ISR body never ran
; once in 5 s. That is consistent with TWO very different worlds -- the tempo
; oscillator is not pulsing (SYNC switch in, or a dead line), or the PCINT
; never fires whatever the pins do. Nothing in the shipping arrangement can
; tell them apart, because the one counter meant to (pc_masked_edge, PCIF0
; sampled at re-arm) is void by construction: loop() clears PCMSK0's low four
; bits for the scan, and a masked pin cannot set PCIF0 at all. It reads zero
; whether or not the line moved. That is L124 again, in an instrument I wrote
; this morning, so it is stated here rather than quietly dropped.
;
; This build removes ONLY the scan-window mask. During the scan PB0-3 carry
; matrix data and hop levels constantly -- that hopping is the very reason the
; mask exists -- so a working PCINT path MUST count hundreds of entries per
; pass. pc_entry large = the vector, the enable and the pins are all fine and
; the quiet line is a real observation about the oscillator. pc_entry still 0 =
; the fault is the interrupt path, not the panel.
;
; NEVER SHIP. Without the mask the tempo estimate is poisoned by scan edges,
; which is the defect the mask was added to prevent.
build_flags =
  ${env:app-test-pcint.build_flags}
  -DPCINT_POSCTL
extends = env:app-test-pcint

[env:app-duty]
; env:app + the claim-085 Phase 1 loop-accounting counter set, SysEx 0x5A -> 0x5B.
; This is the build BOTH the BEFORE and the AFTER run must use: conditions 3a and
; 4 are before/after conditions, so a row taken on a different binary answers a
; question nobody asked (the same reason combined-nat-hwm extends combined-nat).
;
; env:app AND NOT a combined env, deliberately, and it is CORE's call not mine:
; the ladder makes the machine SLEEP, and a combined build is running the D650C
; emulator against a real-time bar (G5), so sleeping there is not legal.
;
; NEVER SHIP. It claims Timer3 and adds a TIMER3_OVF ISR; 0x5A 0x02 makes the
; machine sleep on command and decimate its own debouncers, which per the caveat
; at the call site in main.cpp is an instrument calibration and not a playable
; machine.
extends = env:app
build_flags =
  ${env:app.build_flags}
  -DSUPEROS_LOOP_ACCT

[env:combined-nat-probe]
; combined-nat (16 MHz native) + the cycle probe, to capture the finalized-build
; G5 baseline over ISP. Never ship: writes EEPROM every 4 s.
;
; NO_MICROBENCH is not optional here, for two independent reasons. Layout: the
; app region has to end below the commit-arm page 0xD700 (makesyx.py, and the
; guard is a real hazard -- app bytes there can read as the arm magic), and
; combined-nat leaves 1668 B of headroom while the full probe costs 1670. The
; microbench is what does not fit, by 2 bytes. Instrument: finding 24's 4 MHz
; row (~59k, 52%) was captured on combined-4mhz-nat-probe, which also sets this
; flag, so dropping the microbench is what makes the 16 MHz number comparable
; with the 4 MHz one rather than a second instrument. The microbench publishes
; to EEPROM 0x830/0x840/0x848 and is unrelated to the cyc/s at 0x010 that G5
; reads; it also stalls the first pass, which would pollute the first window.
;
; D650_PROBE_G5_ONLY is also not optional, and it is why this env links at all.
; It strips the three auxiliary EEPROM blocks (reset cause 0x86C, raw panel
; 0x860, sticky-seen 0x870) and their per-scan maintenance, none of which G5
; reads. Without it this env is 333 B OVER the 0xD700 app ceiling and has been
; unbuildable since d165265, which is why G8's G5 row says "projected".
extends = env:combined-nat
build_flags =
  ${env:combined-nat.build_flags}
  -DD650_CYCLE_PROBE
  -DD650_NO_MICROBENCH
  -DD650_PROBE_G5_ONLY
  -DSUPEROS_NO_SYSEX_RANDOMIZE

[env:combined-4mhz-nat-probe]
; nat + the cycles/s, ISR-rate and hitch telemetry published to EEPROM 0x010.
; This is the env finding 24's 4 MHz row (~59k cyc/s, 52%) was captured on.
;
; The two strip flags carry the same justification as on combined-nat-probe and
; are what makes this env link again: without them it is 301 B OVER the 0xD700
; ceiling. Neither strips anything the emulator executes -- the auxiliary EEPROM
; blocks are published once per 4 s window from the probe itself, and 0x2E is a
; host-driven SysEx opcode nothing sends during a throughput run.
extends = env:combined-4mhz-nat
build_flags =
  ${env:combined-4mhz-nat.build_flags}
  -DD650_CYCLE_PROBE
  -DD650_NO_MICROBENCH
  -DD650_PROBE_G5_ONLY
  -DSUPEROS_NO_SYSEX_RANDOMIZE

[env:combined-4mhz-nat-svc]
; nat + a breakdown of where the wall clock goes outside the emulated CPU.
extends = env:combined-4mhz-nat-probe
build_flags =
  ${env:combined-4mhz-nat-probe.build_flags}
  -DD650_SVC_PROBE
  ; claim-131 key queue stripped: this instrument sat within a few hundred
  ; bytes of the ceiling and its question does not involve step entry. It
  ; measures a machine WITHOUT the write-mode key queue.
  -DSUPEROS_NO_KEYQUEUE

[env:combined-4mhz-hle-profile]
extends = env:combined-4mhz
build_flags =
  ${env:combined-4mhz.build_flags}
  -DUCOM4_HLE
  -DD650_CYCLE_PROBE
  -DUCOM4_PC_PROFILE

; nat + profile: histogram of what the INTERPRETER still executes (the
; translated regions never touch it), i.e. exactly what to translate next.
[env:combined-4mhz-nat-profile]
extends = env:combined-4mhz-nat-probe
build_flags =
  ${env:combined-4mhz-nat-probe.build_flags}
  -DUCOM4_PC_PROFILE
  ; claim-131 key queue stripped: this instrument sat within a few hundred
  ; bytes of the ceiling and its question does not involve step entry. It
  ; measures a machine WITHOUT the write-mode key queue.
  -DSUPEROS_NO_KEYQUEUE

; Cycle probe plus an emulated-PC histogram, to aim HLE at the real hot loop.
[env:combined-4mhz-profile]
extends = env:combined-4mhz
build_flags =
  ${env:combined-4mhz.build_flags}
  -DD650_CYCLE_PROBE
  -DUCOM4_PC_PROFILE

; Same probe on the undivided core, for the comparison that matters.
[env:combined-probe]
extends = env:combined
build_flags =
  ${env:combined.build_flags}
  -DD650_CYCLE_PROBE

; ---- USB bring-up diagnostic bootloader ------------------------------------
; Same bootloader, plus a USB status display on step LEDs 1-4 (see the
; SUPEROS_USB_DIAG block in bootload.c). Flash it over ISP when USB-C does not
; enumerate: it reports whether VBUS is sensed, whether the host ever drove a
; bus reset, and whether enumeration completed, without needing MIDI or any
; host-side tooling.
[env:bootloader-usbdiag]
extends = env:bootloader
build_flags =
    ${env:bootloader.build_flags}
    -DSUPEROS_USB_DIAG

; ---- SPM flash-write service (internal-flash builds only) ------------------
; Lives in the empty top of the boot section (pages 0x1FA-0x1FE), well above the
; running bootloader, with its call-in trampolines pinned at 0x1FE00. Build emits service-install.syx; flash it
; via SysEx in bootloader mode once, and patterns persist across power-off.
;
; It also carries the two privileged entries that let the app replace the
; RESIDENT BOOTLOADER over USB or DIN (stage at 0x1FE04, commit at 0x1FE08).
; Reinstall the service before trying a bootloader update on a board that has
; the older single-entry build: flash_boot_service_present() reports it.
[env:flash-service]
build_src_filter = +<flash_service/*>
platform = atmelavr
board_build.mcu = at90usb1286
board_build.f_cpu = 16000000L
framework =
build_flags =
    -Os
    -Wl,--entry=flash_service_entry
    ; The three 4-byte JMP trampolines stay pinned at 0x1FE00/04/08 forever:
    ; every installed app calls those absolute addresses, so they must not move
    ; even when the code behind them does. The code itself sits BELOW them, in
    ; the boot pages left free between the bootloader body (ends 0x1F8FF) and
    ; the trampolines, with page 0x1F9 left empty as margin. The link fails if
    ; either end runs into its neighbour.
    -Wl,--section-start=.service_entry=0x1FE00
    -Wl,--section-start=.text=0x1FA00
extra_scripts =
    pre:tools/flash_service_link.py
    post:tools/make_service_syx.py

; ---- fuses (only when flashing a blank chip via ISP) -----------------------
; lfuse 0xDF: external crystal, no /8, CKOUT OFF (bit6 = 1). CKOUT ON would
; route the system clock onto AVR PC7 — which on this socket is µPD650 PF3 =
; ACCENT. That would force every hit accented.
; hfuse 0xD2: EESAVE programmed, so an ISP chip erase keeps the internal
; EEPROM — the emulator's pattern store and any uploaded program image survive
; firmware reflashes. BOOTRST on, 4 KB boot section.
; Also clears any lock bits, which the chip erase does implicitly — a board that
; arrived with LB programmed refuses further programming until it is erased.
; efuse is deliberately NOT written: the brown-out level a board shipped with is
; fine, and every fuse write is a chance to brick a part that only a high-voltage
; programmer can recover.
[env:fuses]
platform = atmelavr
board_build.mcu = at90usb1286
upload_protocol = custom
upload_command =
    avrdude -c atmelice_isp -p at90usb1286 -B 4 -e
    -U lfuse:w:0xDF:m
    -U hfuse:w:0xD2:m
